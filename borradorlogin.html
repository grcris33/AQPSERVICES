<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AQPService - Registro</title>
  <link rel="stylesheet" href="estilologin1.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logotipo.png" alt="Logotipo AQPSERVICE">
    </div>
    <nav>
      <ul>
        <li><a href="borrador_Inicio.html">AQPService</a></li>
        <li><a href="borrador_Inicio.html">Inicio</a></li>
      </ul>
    </nav>
  </header>
  <div class="container">
    <h1>Registro Cliente</h1>
    <form action="db.php" method="post">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="form-group">
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>
      </div>
      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>
      </div>
      <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
      </div>
      
      <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>
      </div>
      <div class="form-group">
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
      </div>
      <button type="submit">Registrarse</button>
    </form>
  </div>
</body>
</html>
